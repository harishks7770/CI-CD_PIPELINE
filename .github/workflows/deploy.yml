name: Fabric Auto-Deploy

# 1. THE TRIGGER
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Keeps the manual button available as a backup

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      
      # 2. THE HANDSHAKE
      - name: Get Azure Token
        run: |
          TOKEN=$(curl -s -X POST https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token \
            -d 'client_id=${{ secrets.AZURE_CLIENT_ID }}' \
            -d 'scope=https://api.fabric.microsoft.com/.default' \
            -d 'client_secret=${{ secrets.AZURE_CLIENT_SECRET }}' \
            -d 'grant_type=client_credentials' | jq -r .access_token)
          echo "FABRIC_TOKEN=$TOKEN" >> $GITHUB_ENV
          
      # 3. THE COMMAND
      - name: Trigger Fabric Deployment
        run: |
          curl -X POST https://api.fabric.microsoft.com/v1/deploymentPipelines/https://app.fabric.microsoft.com/pipelines/86d8facc-25b0-4e36-bbc4-9d9965c01d66?experience=fabric-developerg/deploy \
          -H "Authorization: Bearer ${{ env.FABRIC_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "sourceStageId": "6fadcfc5-fc55-4adf-988c-08c73e0dc9cc",
            "targetStageId": "e726e4a1-690d-4d6a-a795-9c3027ba729b",
            "note": "Automated deployment from GitHub Actions"
          }'
